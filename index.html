@media (min-width:520px){.hcmp{grid-template-columns:1fr 1fr}.hspl{grid-template-columns:1fr 1fr 1fr}}

.hset{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.hset .tx{display:flex;align-items:center;gap:7px;font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hset .tx .i{color:#F3C98B}
.hset .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hset .opt-btn{flex-direction:column;align-items:flex-start;gap:2px;height:auto;min-height:52px;padding:8px 12px;text-align:left}
.hset .opt-btn small{font-size:11.5px;font-weight:500;color:var(--muted)}
.hform-ends{display:flex;justify-content:space-between;margin-top:4px;padding:0 4px;font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ---------- Sur mesure en avant ---------- */
.perso-cta{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:16px 16px 16px 14px;border-radius:24px;text-align:left;isolation:isolate;
  background:linear-gradient(125deg,rgba(255,203,92,.24),rgba(255,139,61,.13) 55%,rgba(255,111,163,.1));border:1px solid rgba(255,203,92,.42);
  box-shadow:0 14px 34px -18px rgba(255,160,60,.55);transition:transform .15s var(--ease);animation:viewIn .45s var(--ease) both}
.perso-cta::before{content:"";position:absolute;inset:-40% -10% auto auto;width:190px;height:190px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,203,92,.35),transparent);z-index:-1}
.perso-cta:active{transform:scale(.98)}
.perso-cta .ic{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:rgba(255,203,92,.2);color:var(--gold);border:1px solid rgba(255,203,92,.35)}
.perso-cta .ic .i{width:28px;height:28px}
.perso-cta .tx{flex:1;min-width:0}
.perso-cta b{display:block;font:700 19px/1.1 var(--f-display);letter-spacing:-.015em}
.perso-cta small{display:block;margin-top:4px;font-size:13.5px;color:var(--muted)}
.perso-cta .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.perso-cta .pills span{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:650;color:#FFE3A6;background:rgba(255,203,92,.12);border:1px solid rgba(255,203,92,.22)}
.perso-cta .pills .i{width:13px;height:13px}
.perso-cta .go{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--gold);color:#2a1a02}
.favs.top{margin-top:10px}

/* ---------- Présentation et nouveautés ---------- */
.layer.tourl{align-items:center}
.panel.tour{width:min(440px,calc(100% - 28px));border-radius:30px;overflow:hidden}
.tour-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 22px 22px;isolation:isolate}
.tour-in::before{content:"";position:absolute;inset:-30% -20% auto;height:260px;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent);z-index:-1}
.tour-art{display:grid;place-items:center;width:112px;height:112px;margin-bottom:18px;border-radius:36px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);box-shadow:0 20px 50px -18px color-mix(in srgb,var(--c) 70%,transparent);animation:tourPop .5s var(--spring) both}
.tour-art .i{width:54px;height:54px;stroke-width:1.6}
@keyframes tourPop{from{transform:scale(.7) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.tour-in .eyebrow{color:var(--c)}
.tour-in h2{margin:10px 0 0;font:700 23px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.tour-in p{margin:12px 0 0;font-size:16px;line-height:1.5;color:var(--muted);text-wrap:pretty;min-height:96px}
.tour-dots{display:flex;gap:7px;margin:16px 0 18px}
.tour-dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.18);transition:width .3s var(--ease),background .3s}
.tour-dots i.on{width:22px;background:var(--c)}
.tour-act{display:flex;gap:10px;width:100%}
.tour-act .btn{flex:1}
.tour-act .btn.primary:only-child{flex:1}
.news-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.news-it{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);animation:viewIn .4s var(--ease) both}
.news-it .ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:rgba(31,209,242,.1);color:var(--cyan)}
.news-it b{display:block;font-size:15px}
.news-it small{display:block;margin-top:2px;font-size:13.5px;line-height:1.35;color:var(--muted)}
.panel.news .eyebrow{display:inline-flex;align-items:center;gap:6px}

/* ---------- Classement ---------- */
button.pill{cursor:pointer}
.topcard{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:12px 14px;border-radius:20px;text-align:left;background:linear-gradient(120deg,rgba(255,203,92,.16),rgba(255,139,61,.08));border:1px solid rgba(255,203,92,.32)}
.topcard .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,203,92,.16);color:var(--gold);flex:none}
.topcard .tx{flex:1}
.topcard b{display:block;font:650 16px/1.15 var(--f-display)}
.topcard small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.topcard > .i{color:var(--gold)}
.topme{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:14px}
.tmrow{display:flex;align-items:center;gap:12px}
.tmrow .tx{flex:1;min-width:0}
.tmrow b{display:block;font-size:15.5px}
.tmrow small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.lvb{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font:700 18px var(--f-display);color:#2a1a02;background:linear-gradient(135deg,var(--gold),var(--orange));flex:none}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input{height:48px;padding:0 14px;border-radius:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);font-size:16px;outline:none}
.fld input:focus{border-color:var(--cyan)}
.toplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.toplist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);animation:viewIn .35s var(--ease) both}
.toplist li.me{border-color:rgba(31,209,242,.55);background:rgba(31,209,242,.08)}
.toplist .rk{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;font:700 14px var(--f-display);color:var(--muted);background:rgba(255,255,255,.05);flex:none}
.toplist .rk .i{width:18px;height:18px}
.toplist li.p1 .rk{color:#2a1a02;background:linear-gradient(135deg,#FFE08A,#FFB547)}
.toplist li.p2 .rk{color:#1b2230;background:linear-gradient(135deg,#E9EEF7,#AEB8CC)}
.toplist li.p3 .rk{color:#2a1407;background:linear-gradient(135deg,#F3B27A,#C9763D)}
.toplist .nm{flex:1;min-width:0}
.toplist .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toplist .nm b small{font-weight:500;color:var(--cyan)}
.toplist .nm > small{display:block;font-size:12px;color:var(--muted)}
.toplist .xp{font:700 16px/1 var(--f-display);color:var(--gold);text-align:right}
.toplist .xp small{display:block;margin-top:2px;font:600 10px var(--f-ui);color:var(--faint)}

/* ---------- Duel en direct ---------- */
.livecta{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;padding:14px;border-radius:20px;text-align:left;background:linear-gradient(120deg,rgba(255,111,163,.2),rgba(165,139,255,.12));border:1px solid rgba(255,111,163,.4)}
.livecta .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,111,163,.16);color:var(--rose);flex:none}
.livecta .tx{flex:1}
.livecta b{display:block;font:650 16px/1.15 var(--f-display)}
.livecta small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.livecta > .i{color:var(--rose)}
.view.live .head{margin-bottom:10px}
.lhero{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,rgba(255,111,163,.18),transparent 60%),var(--card);border:1px solid var(--line)}
.lhero .vs{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:rgba(255,111,163,.16);color:var(--rose);flex:none}
.lhero .vs .i{width:28px;height:28px}
.lhero p{margin:0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.view.live .fld{margin-top:14px}
.lbox{padding:14px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lrow .lab{font-weight:650;font-size:14.5px}
.ljoin{display:flex;gap:10px}
.ljoin input{flex:1;min-width:0;height:52px;padding:0 14px;border-radius:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);font:700 22px var(--f-display);letter-spacing:.3em;text-transform:uppercase;text-align:center;outline:none}
.ljoin input:focus{border-color:var(--rose)}
.lcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-top:14px;padding:22px 16px;border-radius:26px;background:radial-gradient(120% 90% at 50% 0%,rgba(255,111,163,.14),transparent 60%),var(--card);border:1px solid var(--line)}
.lcard h2{margin:0;font:700 24px/1.15 var(--f-display)}
.lcode{font:800 40px/1 var(--f-display);letter-spacing:.18em;color:var(--text);padding:8px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px dashed var(--line-2)}
.lplayers{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;margin:6px 0}
.lplayers .pl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1}
.lplayers .av{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font:700 24px var(--f-display);color:#1a0716;background:linear-gradient(135deg,var(--rose),var(--lilac))}
.lplayers .pl.me .av{color:#04121a;background:linear-gradient(135deg,var(--cyan),var(--azure))}
.lplayers .pl.wait .av{background:rgba(255,255,255,.06);border:2px dashed var(--line-2)}
.lplayers b{font-size:15px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lplayers small{font-size:12px;color:var(--muted)}
.lplayers .vs{font:800 14px var(--f-display);color:var(--faint)}
.dotp{width:10px;height:10px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.lprep{display:flex;flex-direction:column;align-items:center;gap:10px}
.lerr{margin:0;color:var(--bad);font-weight:600}
.lscore{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}
.lscore > span{display:flex;flex-direction:column;align-items:center;min-width:76px}
.lscore b{font:700 20px/1 var(--f-display)}
.lscore .me b{color:var(--cyan)}
.lscore .ot b{color:var(--rose)}
.lscore small{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--muted)}
.lscore .qn{font:700 12px var(--f-display);color:var(--faint);min-width:auto}
.lwarn{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:8px 12px;border-radius:12px;font-size:13px;color:#FFE3A6;background:rgba(255,203,92,.08);border:1px dashed rgba(255,203,92,.35)}
.lwait{font-size:13px;font-weight:600;color:var(--rose)}
#lans:not(.locked) .choice.sel{border-color:var(--cyan);background:rgba(31,209,242,.12)}
#lans .choice{position:relative}
.lop{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font:700 13px var(--f-display);color:#1a0716;background:linear-gradient(135deg,var(--rose),var(--lilac));box-shadow:0 0 0 2px var(--bg)}
.lres{display:flex;justify-content:center;gap:12px;margin-top:12px;animation:viewIn .3s var(--ease) both}
.lres span{display:flex;flex-direction:column;align-items:center;min-width:96px;padding:10px 12px;border-radius:16px;font:700 22px/1 var(--f-display);background:var(--card);border:1px solid var(--line)}
.lres span.g{color:var(--good);border-color:rgba(59,229,157,.4)}
.lres span.b{color:var(--faint)}
.lres small{margin-top:4px;font:600 11px var(--f-ui);color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbig{display:grid;place-items:center;width:84px;height:84px;border-radius:28px;background:rgba(255,255,255,.06);color:var(--muted)}
.lbig .i{width:42px;height:42px}
.lend.win .lbig{color:#2a1a02;background:linear-gradient(135deg,#FFE08A,#FFB547);box-shadow:0 18px 40px -16px rgba(255,181,71,.8)}
.lend.lose .lbig{color:var(--rose);background:rgba(255,111,163,.12)}
.lfinal{display:flex;gap:10px;width:100%}
.lfinal div{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 8px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lfinal div.lead{border-color:rgba(255,203,92,.5);background:rgba(255,203,92,.08)}
.lfinal b{font:800 30px/1 var(--f-display)}
.lfinal small{margin-top:6px;font-size:12.5px;color:var(--muted)}
.ltitle{flex:1;text-align:center;font:650 15px var(--f-display);color:var(--muted)}

/* Sosies : pourquoi tu t'es trompé, loupes, moyen mnémo */
.why{margin-top:12px;padding:12px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.why.err{background:linear-gradient(180deg,rgba(255,203,92,.07),rgba(255,255,255,.02));border-color:rgba(255,203,92,.24)}
.fsec .why + .why{margin-top:14px}
.whyh{display:flex;align-items:center;gap:10px}
.whyh .wi{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:12px;background:rgba(255,203,92,.14);color:var(--gold)}
.why.neu .whyh .wi{background:rgba(255,111,163,.12);color:var(--rose)}
.whyh .wt{display:flex;flex-direction:column;gap:3px;min-width:0}
.whyh .wt b{font:700 16px/1.15 var(--f-display)}
.whyh .wt small{font-size:13.5px;line-height:1.35;color:#FFE3A6}
.why.neu .whyh .wt small{color:var(--muted)}
.zleg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0;font-size:13px;font-weight:700;text-align:center}
.zleg span{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.zleg em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.why.err .zleg .zsa{color:var(--good)}
.why.err .zleg .zsb{color:var(--bad)}
.why.neu .zleg .zsa{color:var(--cyan)}
.why.neu .zleg .zsb{color:var(--lilac)}
.zrow{margin-top:14px}
.zlab{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zlab b{font-weight:700;color:var(--text)}
.zlab .zmap{width:30px;height:22px;flex:none;color:var(--muted)}
.zlab > .i{width:18px;height:18px;margin:0 6px;color:var(--muted)}
.zfirst{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#1A0C02;background:var(--gold)}
.zfirst .i{width:13px;height:13px}
.zpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.zl{margin:0;display:flex;flex-direction:column;align-items:center}
.zl .zlens{display:block;width:min(100%,156px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.zl figcaption{margin-top:4px;font-size:13.5px;font-weight:650;line-height:1.25;text-align:center}
.zlens .rim{fill:none;stroke-width:5}
.zlens .hdl{fill:none;stroke-width:9;stroke-linecap:round}
.why.err .zsa .rim,.why.err .zsa .hdl{stroke:var(--good)}
.why.err .zsb .rim,.why.err .zsb .hdl{stroke:var(--bad)}
.why.neu .zsa .rim,.why.neu .zsa .hdl{stroke:var(--cyan)}
.why.neu .zsb .rim,.why.neu .zsb .hdl{stroke:var(--lilac)}
.why.err .zl.zsa figcaption{color:#C2F7DF}
.why.err .zl.zsb figcaption{color:#FFC9D3}
.ztxt .zpair span{padding:9px 10px;border-radius:14px;font-size:13.5px;line-height:1.3;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.why.err .ztxt .zsa{border-color:rgba(59,229,157,.38)}
.why.err .ztxt .zsb{border-color:rgba(255,92,122,.38)}
.why.neu .ztxt .zsa{border-color:rgba(31,209,242,.32)}
.why.neu .ztxt .zsb{border-color:rgba(165,139,255,.32)}
.zsize{display:block;width:100%;height:auto;margin-top:6px;color:var(--text)}
.zsize .gr{stroke:currentColor;stroke-opacity:.25;stroke-width:1.5;fill:none}
.zsize g{stroke-width:0}
.zsize g path[fill=none]{fill:none}
.zsize .zsa{fill:var(--cyan);stroke:var(--cyan)}
.zsize .zsb{fill:var(--lilac);stroke:var(--lilac)}
.why.err .zsize .zsa{fill:var(--good);stroke:var(--good)}
.why.err .zsize .zsb{fill:var(--bad);stroke:var(--bad)}
.zcap span{font-size:12.5px;line-height:1.3;text-align:center;color:var(--muted)}
.zcap b{display:block;font-size:15px;color:var(--text)}
.memo{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:11px 12px;border-radius:16px;background:rgba(255,203,92,.08);border:1px solid rgba(255,203,92,.28)}
.memo .mi{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:11px;background:rgba(255,203,92,.16);color:var(--gold)}
.memo small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.memo p{margin:3px 0 0;font-size:14.5px;line-height:1.42;color:#FFF1CC}
.memo-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.memo-act .chip{height:34px}
.memoin{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.memoin[hidden]{display:none}
.memoin textarea{width:100%;min-height:64px;padding:10px 12px;border-radius:14px;border:1px solid var(--line-2);background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:15px;resize:vertical}
.zall{margin-top:12px}
.zall summary{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:650;color:var(--muted);list-style:none}
.zall summary::-webkit-details-marker{display:none}
.zall[open] summary{margin-bottom:8px}
.zlook{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.zchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 11px 0 5px;border-radius:99px;font-size:13px;font-weight:650;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.zchip .zmap{width:26px;height:19px;color:var(--muted)}
.zchip > .i{width:16px;height:16px;margin:0 3px 0 4px;color:var(--muted)}
.zhint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.zdrill{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:600;color:var(--rose)}
.lsec p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.lmore2{font-size:13px;font-weight:650;color:var(--cyan);margin-right:auto}
.drills{display:flex;flex-direction:column;gap:8px;margin:0 auto;max-width:520px;text-align:left}
.conf.drill{width:100%;text-align:left}
.conf.drill .tx{font-size:13.5px}
.conf.drill .tx em{display:block;margin-top:4px;font-style:normal;font-size:12px;line-height:1.3;color:#FFE3A6}
.conf.drill .go{display:inline-flex;align-items:center;gap:4px;flex:none;padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:800;color:#1A0716;background:linear-gradient(120deg,var(--rose),var(--lilac))}

    js.onload = () => res(); js.onerror = () => { LEAFP = null; rej(new Error("carte")); };
    document.head.appendChild(js);

}

/* ---------- Racines ---------- */
function findExample(w) {
  const re = new RegExp("(^|\\s)" + w + "(\\s|$)", "i");
  const recs = Object.values(S.sp).filter(r => re.test(r.sci || ""));
  if (recs.length) { const r = pick(recs); return { sci: r.sci, fr: r.fr }; }
  for (const d of DUELS) { if (re.test(d[0])) return { sci: d[0], fr: d[2] }; if (re.test(d[1])) return { sci: d[1], fr: d[3] }; }
  return null;
}
function buildRoot(ses) {
  const entries = Object.entries(ROOTS).filter(([, m]) => !/^(dédié|imitation|ancien nom)/.test(m));
  const recent = new Set(ses.recent);
  const pool = entries.filter(([w]) => !recent.has(w));
  const [w, m] = pick(pool.length ? pool : entries);
  ses.recent.push(w);
  const [mean, note] = m.split("|");
  const k = clamp(ses.cfg.k || 4, 3, 6);
  const others = [...new Set(shuffle(entries.map(([, x]) => x.split("|")[0])).filter(x => norm(x) !== norm(mean)))].slice(0, k - 1);
  const choices = shuffle([mean, ...others]).map((x, i) => ({ key: "r" + i, label: x }));
  const ex = findExample(w);
  return { kind: "root", w, mean, note: note || "", ex, choices, answerKey: choices.find(c => c.label === mean).key, format: "qcm", level: "root", k, hintsUsed: 0,
    hints: ex ? [{ ic: "bird", tx: `On le trouve chez : ${ex.fr} (${ex.sci})` }] : [] };
}

function warm(q) {
  if (q.photo) { preload(q.photo.lg); preload(q.photo.md); }
  if (q.format === "tiles") (q.choices || []).forEach(c => c.t?.img && preload(c.t.img.md));
}

/* ---------- Réponses ---------- */
function typedTargets(q) {
  const t = q.t;
  if (q.level === "family") { const f = TAXO.fam.get(fam(t)); return [f?.fr, f?.vern, f?.sci].filter(Boolean); }
  if (q.level === "order") { const o = TAXO.ord.get(ord(t)); return [o?.fr, o?.sci, o?.vern].filter(Boolean); }
  if (q.level === "genus") return [genus(t)];
  if (q.stim === "fr") return [t.sci];
  if (q.stim === "la") return [t.fr || t.sci];
  return q.names === "fr" ? [t.fr || t.sci] : q.names === "la" ? [t.sci] : [t.fr, t.sci].filter(Boolean);
}
function checkTyped(str, q) {
  const a = norm(str);
  if (!a) return { ok: false };
  for (const c of typedTargets(q)) {
    const n = norm(c);
    if (!n) continue;
    const tol = n.length <= 5 ? 0 : n.length <= 11 ? 1 : 2;
    if (a === n || lev(a, n) <= tol) return { ok: true, exact: a === n };
  }
  if (q.level === "species") {
    const g = norm(genus(q.t)), first = norm(q.t.fr || "").split(" ")[0];
    if (a.split(" ")[0] === g || (first && a === first)) return { ok: false, partial: true };
  }
  return { ok: false };
}
function xpFor(ses, q, res, ms) {
  if (q.kind === "geo") return q.format === "map" ? (res.geoPts || 0) : (res.ok ? 40 : 0);
  if (!res.ok) return res.partial ? 3 : 0;
  let x = q.kind === "root" ? 7 : q.kind === "hand" ? 9 : 10;
  const nC = q.choices?.length || q.k || 5;
  const fm = { qcm: .6 + .1 * nC, tiles: .6 + .1 * nC, audio: 1.3, type: 1.8, flash: .7 }[q.format] || 1;
  const sm = { photo: 1, field: 1.2, son: 1.4, soncho: 1, fr: 1, la: .9 }[q.stim] || 1;
  const lm = { species: 1, genus: .9, family: .85, order: .65 }[q.level] || 1;
  const dm = { facile: .8, moyen: 1, expert: 1.3 }[q.diff] || 1;
  x *= fm * sm * lm * dm;
  x *= Math.max(.3, 1 - .3 * (q.hintsUsed || 0));
  if (ms < 4000) x += 2;
  x += Math.min(10, ses.combo);
  if (q.bonus) x *= 2;
  return Math.max(1, Math.round(x));
}

function settle(res) {
  const ses = SES, q = ses?.q;
  if (!q || q.done) return;
  q.done = true;
  clearQTimer();
  const ms = Date.now() - (q.t0 || Date.now());
  const ok = !!res.ok;
  if (ok) { ses.combo++; ses.maxCombo = Math.max(ses.maxCombo, ses.combo); S.best.combo = Math.max(S.best.combo, ses.combo); }
  else ses.combo = 0;
  const gain = xpFor(ses, q, res, ms);
  if (gain) { addXp(gain); ses.xp += gain; }
  const d = today(); d.q++; if (ok) d.ok++;
  if (q.kind === "taxon") {
    const r = rec(q.t);
    if (!r.n) ses.newSp.push(q.t.id);
    r.n++; if (ok) { r.ok++; r.lastOk = dayKey(); }
    r.last = dayKey();
    const mod = (q.stim === "son" || q.stim === "soncho") ? "son" : (q.stim === "fr" || q.stim === "la") ? "nom" : "photo";
    if (q.level === "species") {
      srsUpdate(r, mod, ok, (q.hintsUsed || 0) > 0);
      const pk = q.photo && (q.stim === "photo" || q.stim === "field") ? photoKey(q.photo.lg || q.photo.md) : 0;
      const su = q.stim === "son" ? q.snd?.url : q.stim === "soncho" ? (q.choices || []).find(c => c.t?.id === q.t.id)?.snd?.url : "";
      if (pk) r.ps = pushU(r.ps, pk, 20);
      if (ok && !(q.hintsUsed > 0)) {
        if (q.stim === "field" && pk) r.fk = pushU(r.fk, pk);
        else if (pk) r.pk = pushU(r.pk, pk);
        if (su) r.sk = pushU(r.sk, sndKey(su));
        if (pk || su) r.od = pushU(r.od, todayNum(), 8);
      }
      logAttempt(q.t.id, ok, q.stim === "field" ? "f" : mod === "son" ? "s" : mod === "nom" ? "n" : "p", pk || (su ? sndKey(su) : 0));
    }
    else { const f = fam(q.t); if (f) { const s = S.fam[f] || (S.fam[f] = { n: 0, ok: 0 }); s.n++; if (ok) s.ok++; } }
    bump(q.level === "family" ? "fam" : q.level === "genus" ? "genre" : q.level === "order" ? "ordre" : mod, ok);
    if (q.format === "type") bump("type", ok);
    if (ok && mod === "son") count("ear");
    if (ok && (q.stim === "fr" || (q.names === "la" && q.level === "species"))) count("latin");
    if (ok && q.level === "family") count("famok");
    if (ok && q.format === "type") count("typeok");
    if (ok && q.bonus) count("rare");
    if (!ok && res.chosen?.t && q.level === "species" && res.chosen.t.id !== q.t.id) {
      rec(res.chosen.t);
      r.conf[res.chosen.t.id] = (r.conf[res.chosen.t.id] || 0) + 1;
      (ses.confs || (ses.confs = [])).push([q.t.id, res.chosen.t.id]);
    }
    if (!ok) ses.missed.push(q.t);
  } else if (q.kind === "geo") { bump("geo", ok); if (ok) count("geook"); }
  else if (q.kind === "root") { bump("root", ok); if (ok) count("rootok"); }
  else if (q.kind === "hand") { bump("hand", ok); if (ok) count("handok"); handRecord(q, ok); if (!ok && q.sp) (ses.hmiss || (ses.hmiss = [])).push(q.sp); }
  ses.results.push({ ok, part: !!res.partial, xp: gain, id: q.t?.id || null, kind: q.kind });
  const L = level();
  if (L.n > (ses.lvlNow || ses.lvl0)) {
    ses.lvlNow = L.n;
    setTimeout(() => { sfx.lvl(); confetti(); toast(`Niveau ${L.n} : ${L.rank} !`); }, 650);
  }
  save();
  if (ok) { sfx.ok(); if (ses.combo >= 5 && ses.combo % 5 === 0) setTimeout(sfx.combo, 250); } else sfx.bad();
  showFeedback(q, res, gain);
}

async function nextQuestion() {
  const ses = SES;
  if (!ses || ses.ended) return;
  hideFeedback();
  if ((ses.deadline && Date.now() >= ses.deadline) || (ses.len && ses.results.length >= ses.len)) return endSession();
  let p = ses.nextP;
  ses.nextP = null;
  let q = null;
  const slow = setTimeout(() => { if (SES === ses) $("#app").classList.add("waiting"); }, 250);
  try {
    q = p ? await p : await buildNext(ses);
    if (q && q.err) q = await buildNext(ses);
  } catch (e) {
    clearTimeout(slow);
    if (SES === ses) showError(e, ses.cfg, true);
    return;
  }
  clearTimeout(slow);
  $("#app").classList.remove("waiting");
  if (SES !== ses) return;
  if (!q) return endSession();
  showQuestion(q);
}

function showQuestion(q) {
  const ses = SES;
  sndStop();
  ses.q = q;
  q.done = false;
  if (q.t) ses.recent.push(q.t.id);
  go("quiz", q);
  mountQuestion(q);
  q.t0 = Date.now();
  const more = !(ses.len && ses.built >= ses.len);
  if (!ses.nextP && more) ses.nextP = buildNext(ses).catch(e => ({ err: e }));
}

function endSession(aborted) {
  const ses = SES;
  if (!ses || ses.ended) return;
  ses.ended = true;
  clearQTimer();
  sndStop();
  hideFeedback();
  const n = ses.results.length, ok = ses.results.filter(r => r.ok).length;
  let msgs = [];
  if (n) {
    count("sessions");
    if (n >= 10 && ok === n) count("perfect");
    const h = new Date().getHours();
    if (h < 8) count("early");
    if (h >= 22) count("night");
    if (ses.kind === "duel" && n >= 6 && ok >= n - 1) count("duelwin");
    S.hist = [{ t: Date.now(), title: ses.title || "", kind: ses.kind, n, ok, xp: ses.xp, cfg: ses.cfg }, ...(S.hist || [])].slice(0, 30);
    if (n >= 3) {
      const m = markPlayed();
      if (m) msgs.push(m);
      addXp(15); ses.xp += 15;
    }
    if (ses.kind === "serie" && !aborted && n >= ses.len) {
      if (!today().serie) { addXp(50); ses.xp += 50; }
      today().serie = 1;
    }
  }
  if (n && S.hist && S.hist[0]) S.hist[0].xp = ses.xp;
  const badges = checkBadges();
  const L = level();
  if (L.n > ses.lvl0 && !ses.lvlNow) { setTimeout(() => { sfx.lvl(); confetti(); }, 500); }
  save(true);
  topPush();
  if (!n) { SES = null; go("home"); return; }
  go("result", { ses, n, ok, badges, msgs });
  if (ok / n >= .8 || badges.length) setTimeout(() => confetti(), 450);
}

/* ---------- Couleurs ---------- */
const H_RAD = Math.PI / 180;
const hRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };

/* ---------- Géométrie : aile droite déployée, vue de dessus, corps à droite ----------

  for (let i = 0; i < 6; i++) add("S" + (i + 1), "RS", 240 + i * 18, 78 - i * .4, 100 - i * 3, 100 - i, 11.6);
  [[347, 74, 79, 90], [362, 71, 73, 82], [377, 67, 66, 69]].forEach(([x, y, a, L], i) => add("S" + (i + 7), "TT", x, y, a, L, 12.4));
  for (let i = 8; i >= 0; i--) add("CP" + (i + 1), "CP", PB[i][0] + 1, PB[i][1] - 10, PA[i] - 3, 37 - i * .7, 7.6);
  for (let i = 0; i < 6; i++) add("GC" + (i + 1), "GC", 238 + i * 18, 65.5, 98 - i * 3, 45 - i * .6, 11.2);
  for (let j = 0; j < 4; j++) add("GC" + (j + 7), "GC", 336 + j * 14, 63 - j * 2, 82 - j * 5, 42 - j * 2, 10.6);
  for (let k = 0; k < 9; k++) add("MC" + (k + 1), "MC", 240 + k * 18, 55 - Math.max(0, k - 5) * 1.6, 96 - k * 3.4, 27, 10.4);
  add("CC", "CC", 239, 66, 146, 15, 5.2);
  for (let i = 2; i >= 0; i--) add("AL" + (i + 1), "AL", [234, 233, 232][i], [56, 59, 62][i], [171, 164, 157][i], [45, 35, 26][i], 6.8);
  return F;
})();
const WG = Object.fromEntries(WGEO.map(f => [f.id, f]));
const WGROUPS = {
  RP: { n: "Rémiges primaires", s: "P1 à P10", ab: "RP" },
  RS: { n: "Rémiges secondaires", s: "S1 à S6", ab: "RS" },
  TT: { n: "Tertiaires", s: "S7 à S9", ab: "TT" },
  CP: { n: "Couvertures primaires", s: "sur la base des primaires", ab: "CP" },
  GC: { n: "Grandes couvertures", s: "GC1 à GC10", ab: "GC" },
  MC: { n: "Moyennes couvertures", s: "rangée au-dessus des GC", ab: "MC" },
  LC: { n: "Petites couvertures", s: "bord d'attaque du bras", ab: "" },
  AL: { n: "Alule", s: "le « pouce », 3 plumes", ab: "AL" }
};

/* Contour d'une plume. taper : -0.6 carré, 0 rond, 1 pointu. wear > .3 : pointe abîmée.
   wl / wr : demi-largeurs côté v<0 / v>0 (liseré du vexille externe), v0 : décalage latéral. */
function hOutline(f, L, w, taper, wear, v0 = 0, wr) {
  const wl = w; wr = wr ?? w;
  const c = Math.cos(f.a * H_RAD), s = Math.sin(f.a * H_RAD);
  const P = (u, v) => (f.x + c * u - s * (v + v0)).toFixed(1) + "," + (f.y + s * u + c * (v + v0)).toFixed(1);
  const t = clamp(taper || 0, -.6, 1);
  const lp = (bl, ro, po) => t < 0 ? ro + (bl - ro) * (-t / .6) : ro + (po - ro) * t;
  const su = lp(.9, .84, .72), sv = lp(.97, .9, .78), c1u = lp(.99, .96, .9), c1v = lp(.9, .72, .45), c2v = lp(.55, .38, .08);
  const side = (k, W) => k < 0
    ? `M${P(0, -W * .3)}C${P(L * .1, -W * .95)} ${P(L * .32, -W)} ${P(L * .58, -W * .99)}C${P(L * .7, -W * .98)} ${P(L * (su - .06), -W * (sv + .03))} ${P(L * su, -W * sv)}`
    : `C${P(L * (su - .06), W * (sv + .03))} ${P(L * .7, W * .98)} ${P(L * .58, W * .99)}C${P(L * .32, W)} ${P(L * .1, W * .95)} ${P(0, W * .3)}Z`;
  let d = side(-1, wl);

    const n = 8, amp = .025 + wear * .045, pts = [];
    for (let i = 1; i < n; i++) {

    }
    d += `L${pts.join("L")}L${P(L * su, wr * sv)}`;
  } else d += `C${P(L * c1u, -wl * c1v)} ${P(L, -wl * c2v)} ${P(L, 0)}C${P(L, wr * c2v)} ${P(L * c1u, wr * c1v)} ${P(L * su, wr * sv)}`;
  return d + side(1, wr);
}
function hPt(f, u, v) { const c = Math.cos(f.a * H_RAD), s = Math.sin(f.a * H_RAD); return [f.x + c * u - s * v, f.y + s * u + c * v]; }
const hP = (f, u, v) => hPt(f, u, v).map(n => n.toFixed(1)).join(",");

/* Une plume : liseré (couleur e), centre (c), marques (pointe, barre, rayures), rachis. */
function hFeather(f, st, o = {}) {
  const wear = clamp(Math.max(st.wear || 0, o.wear || 0), 0, 1);
  const L = f.L * (o.len ?? 1), w = f.w * (st.wm || 1), sd = f.sd || 1;
  const taper = o.taper ?? st.taper ?? 0;
  const ec = wear ? hMix(st.e, H_BLEACH, wear * .5) : st.e;
  const cc = wear ? hMix(st.c, H_BLEACH, wear * .32) : st.c;
  const fr = st.fr ?? .42; /* largeur du liseré externe, en fraction de la demi-largeur */
  const cen = (Lc, tp, wv) => sd > 0 ? hOutline(f, Lc, w * .97, tp, wv, 0, w * (1 - fr)) : hOutline(f, Lc, w * (1 - fr), tp, wv, 0, w * .97);
  let out = "";
  if (st.bar) {
    const [bc, bs] = st.bar, Lb = L * (1 - bs * (1 - wear * .45));
    out += `<path class="fo" d="${hOutline(f, L, w, taper, wear)}" fill="${wear ? hMix(bc, H_BLEACH, wear * .35) : bc}"/>`;
    out += `<path d="${hOutline(f, Lb, w * .98, taper * .4, 0)}" fill="${ec}"/><path d="${cen(Lb * .95, taper * .4, 0)}" fill="${cc}"/>`;
  } else {
    out += `<path class="fo" d="${hOutline(f, L, w, taper, wear)}" fill="${ec}"/>`;
    out += `<path d="${cen(L * (st.cl || .91), taper, Math.min(wear, .3))}" fill="${cc}"/>`;
  }
  if (st.base) out += `<path d="${hOutline(f, L * .52, w * .97, -.6, 0)}" fill="${st.base}"/>`;
  if (st.white && o.r6) out += `<path d="${hOutline(f, L * .96, w * .5, taper, wear, w * .48 * sd)}" fill="#f1efe8"/>`;
  if (st.bars) {
    const [bc, op] = st.bars, n = Math.max(3, Math.floor(L * .52 / 5.2));
    let d = "";
    for (let i = 0; i < n; i++) { const u = L * (.3 + .55 * i / (n - 1)); d += `M${hP(f, u, -w * .9)}L${hP(f, u + L * .02, w * .9)}`; }
    out += `<path d="${d}" stroke="${bc}" stroke-width="${(w * .24).toFixed(2)}" stroke-opacity="${op}" fill="none" stroke-linecap="round"/>`;
  }
  if (st.tip && !(o.len < 1)) {
    const [k, col0, sz0] = st.tip, col = wear ? hMix(col0, H_BLEACH, wear * .4) : col0, sz = sz0 * (1 - wear * .4);
    if (k === "spot") { const d = L * .22 * sz, h = w * .52 * sz; out += `<path d="M${hP(f, L * .975, -h)}Q${hP(f, L - d * .5, -h * 1.1)} ${hP(f, L - d, 0)}Q${hP(f, L - d * .5, h * 1.1)} ${hP(f, L * .975, h)}Q${hP(f, L * 1.005, 0)} ${hP(f, L * .975, -h)}Z" fill="${col}"/>`; }
    if (k === "wedge") { const d = L * .36 * sz, h = w * .55 * sz; out += `<path d="M${hP(f, L * .97, -h)}L${hP(f, L - d, 0)}L${hP(f, L * .97, h)}Q${hP(f, L * 1.005, 0)} ${hP(f, L * .97, -h)}Z" fill="${col}"/>`; }
    if (k === "oval") { const [cx, cy] = hPt(f, L * .87, 0); out += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(L * .1 * sz).toFixed(1)}" ry="${(w * .5 * sz).toFixed(1)}" transform="rotate(${f.a} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="${col}"/>`; }
  }
  if (o.sheath) out += `<path d="${hOutline(f, o.sheath, w * .4, -.6, 0)}" fill="#a9bdd2" stroke="#5f7590" stroke-width=".5"/>`;
  out += `<path class="ra" d="M${hP(f, L * .05, 0)}L${hP(f, L * .88, 0)}"/>`;
  return `<g class="fe" data-f="${f.id}" data-g="${f.g}">${out}</g>`;
}

/* Bande des petites couvertures (bord d'attaque du bras) et des marginales de la main */
function hArm(look) {

  for (let r = 0; r < 3; r++) for (let x = 233 + (r % 2) * 5; x < 402; x += 10) {

  return `<g class="fe lc" data-f="LC" data-g="LC">${sc}</g>`;
}
function hHand(look) {

/* Styles par zone et génération. gen : "j" juvénile, "a" adulte / post-juvénile. */
function hStyle(look, g, gen, id) {
  const key = g === "RP" || g === "RS" ? "R" : g === "CC" ? "AL" : g;
  const base = look[key] || look.R;
  const j = gen === "j" ? look[key + "j"] : null;
  const st = { ...base, ...(j || {}) };
  if (look.tune && look.tune[id]) Object.assign(st, look.tune[id]);
  return st;
}

/* Numérotation des primaires : à la française (P1 = la petite plume externe, comme Svensson)
   ou à l'anglaise (P1 = la plus interne, ordre de mue EURING / BTO). Les identifiants internes
   de la géométrie restent dans l'ordre de mue (P1 interne) ; seule l'étiquette change. */
const hFr = () => (S.set.pnum || "fr") === "fr";
const hLab = id => /^P\d+$/.test(id) && hFr() ? "P" + (11 - +id.slice(1)) : id;

/* Contour d'une plume entière (surbrillance, sélection, fantôme) */
function hOutlineOf(id, mo) {
  if (id === "LC") return "M226,58C262,50 330,44 404,44C410,48 410,58 404,64C330,66 262,68 228,68Z";
  const f = WG[id];
  if (!f) return "";
  const len = mo && f.g === "RP" ? ([.08, .08, .3, .56, .84, 1][mo[id] ?? 0] || 1) : 1;
  return hOutline(f, f.L * len, f.w, 0, 0);
}
function wingNums(ids) {
  return ids.map(id => {
    const f = WG[id];
    if (!f) return "";
    const [x, y] = hPt(f, f.L + (f.id === "P10" ? 7 : 9), 0);
    return `<text class="num" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}">${hLab(f.id).replace(/^[PS]/, "")}</text>`;
  }).join("");
}
const hGroupIds = g => g === "LC" ? ["LC"] : WGEO.filter(f => f.g === g).map(f => f.id);
function wingOverlay(ids, cls, mo) {
  const all = [];
  for (const x of ids) { if (WGROUPS[x] && x !== "LC") all.push(...hGroupIds(x)); else all.push(x); }
  return all.map(id => `<path class="${cls}" d="${hOutlineOf(id, mo)}"/>`).join("");
}

/* Aile complète.
   w = { look, gen: {id: "j"}, wear: {id: n} | n, mo: {P1: 0..5}, hl: [ids|groupes], mark: [{id, t}], lim: [idA, idB], num: true, tap: true, vb, cls } */
function wingSvg(w) {
  const look = w.look, gens = w.gen || {}, wr = w.wear || 0;
  const wearOf = id => typeof wr === "number" ? wr : (wr[id] ?? wr._ ?? 0);
  let body = "";
  for (const f of WGEO) {
    const st = hStyle(look, f.g, gens[f.id] || "a", f.id);
    const o = { wear: wearOf(f.id) };
    if (w.mo && f.g === "RP") {
      const sc = w.mo[f.id] ?? 0;
      if (sc === 0) o.wear = Math.max(o.wear, .62);
      else if (sc < 5) { o.len = [0, .08, .3, .56, .84][sc]; o.sheath = f.L * Math.min(o.len * .62, .26); o.wear = 0; }
      else o.wear = 0;
      const stn = sc === 0 ? { ...st, c: hMix(st.c, "#8a7a62", .3), e: hMix(st.e, "#b9a988", .32) } : st;
      if (sc > 0 && sc < 5) body += `<path class="ghost" d="${hOutline(f, f.L, f.w, 0, 0)}"/>`;
      body += hFeather(f, stn, o);
      continue;
    }
    if (w.mo && (f.g === "CP" || f.g === "AL" || f.g === "CC")) continue;
    body += hFeather(f, st, o);
    if (f.id === "CP1") body += hHand(look);
    if (f.id === "MC9") body += hArm(look);
  }
  let over = "";
  if (w.hl && w.hl.length) over += wingOverlay(w.hl, "hlp", w.mo);
  if (w.ok && w.ok.length) over += wingOverlay(w.ok, "okp", w.mo);
  if (w.lim) {
    const [a, b] = w.lim.map(id => WG[id]);
    if (a && b) {
      const p1 = hPt(a, a.L * .25, 0), p2 = hPt(b, b.L * .25, 0), q1 = hPt(a, a.L * 1.05, 0), q2 = hPt(b, b.L * 1.05, 0);
      const x0 = (p1[0] + p2[0]) / 2, y0 = (p1[1] + p2[1]) / 2, x1 = (q1[0] + q2[0]) / 2, y1 = (q1[1] + q2[1]) / 2;
      over += `<path class="lim" d="M${x0.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y1.toFixed(1)}"/>`;
    }
  }
  for (const m of w.mark || []) {
    const f = WG[m.id];
    if (!f) continue;
    const [x, y] = m.xy || hPt(f, f.L * (m.u ?? 1.13), 0), wd = m.t.length * 5.2 + 12;
    over += `<g class="mk ${m.c || ""}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><rect x="${(-wd / 2).toFixed(1)}" y="-7.5" width="${wd.toFixed(1)}" height="14" rx="7"/><text y="3.3">${esc(m.t)}</text></g>`;
  }
  if (w.num) over += wingNums(w.num === true ? WGEO.filter(f => f.g === "RP").map(f => f.id) : w.num);
  const vb = w.vb || H_VBF;
  return `<svg class="wing ${w.cls || ""}${vb === H_VBC ? " zc" : ""}" viewBox="${vb}" ${w.tap ? 'data-act="wtap"' : ""} role="img" aria-label="${esc(w.aria || "Aile déployée, vue de dessus")}"><g class="wb">${body}</g><g class="ov">${over}</g></svg>`;
}

/* ---------- Queue (12 rectrices, vue de dessus ; R1 au centre, R6 à l'extérieur) ---------- */
const TGEO = (() => {
  const F = [];
  for (const sd of [1, -1]) for (let i = 6; i >= 1; i--)
    F.push({ id: "R" + i, side: sd > 0 ? "g" : "d", g: "RR", x: 100 - sd * (i - .5) * 5.2, y: 18, a: 90 + sd * (i - .5) * 7.2, L: 98 - (i - 1) * 1.2, w: 9.4, sd });
  return F;
})();
const tailNums = () => TGEO.map(f => { const [x, y] = hPt(f, f.L - 9, 0); return `<text class="num tn" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}">${f.id.slice(1)}</text>`; }).join("");
const tOutlineOf = (id, side) => TGEO.filter(f => f.id === id && (!side || f.side === side)).map(f => hOutline(f, f.L, f.w, 0, 0)).join("");
function tailSvg(t) {
  const look = t.look, st0 = look.RR || look.R;
  let body = "";
  for (const f of TGEO) {
    const g = (t.gen || {})[f.id] || t.def || "a";
    const st = { ...st0, ...(g === "j" ? look.RRj || {} : {}) };
    const taper = g === "j" ? (look.RRj?.taper ?? .75) : (st0.taper ?? -.35);
    const wv = t.wear ? (g === "j" ? t.wear : t.wear * .45) : (g === "j" ? .12 : 0);
    body += hFeather(f, st, { taper, wear: wv, r6: f.id === "R6" }).replace('data-g="RR"', `data-g="RR" data-s="${f.side}"`);
  }
  let over = "";
  for (const id of t.hl || []) over += `<path class="hlp" d="${tOutlineOf(id)}"/>`;
  for (const id of t.ok || []) over += `<path class="okp" d="${tOutlineOf(id)}"/>`;
  if (t.num) over += tailNums();
  return `<svg class="tail ${t.cls || ""}" viewBox="${t.vb || "2 0 196 122"}" ${t.tap ? 'data-act="ttap"' : ""} role="img" aria-label="Queue étalée, vue de dessus"><ellipse cx="100" cy="14" rx="24" ry="12" class="rump" fill="${look.LC || "#6d5d44"}"/><g class="wb">${body}</g><g class="ov">${over}</g></svg>`;
}

/* ---------- Scènes d'âge ---------- */
function hScene(sp, season, young, pat) {
  const gen = {}, wr = {};
  if (sp.mode === "lim" && young) {
    const p = { gc: 10, tt: [0, 0, 0], al: [0, 0, 0], ...(pat || sp.y()) };
    for (const f of WGEO) if (f.g === "RP" || f.g === "RS" || f.g === "CP") gen[f.id] = "j";
    for (let i = 1; i <= 10 - p.gc; i++) gen["GC" + i] = "j";
    p.tt.forEach((nw, i) => { if (!nw) gen["S" + (7 + i)] = "j"; });
    p.al.forEach((nw, i) => { if (!nw) gen["AL" + (i + 1)] = "j"; });
    gen._p = p;
  }
  for (const f of WGEO) {
    const j = gen[f.id] === "j";
    if (season === "aut") wr[f.id] = sp.mode === "wear" ? (young ? 0 : .8) : j ? .1 : 0;
    else wr[f.id] = sp.mode === "lim" ? (j ? .52 : .2) : sp.mode === "comp" ? .22 : .04;
  }
  let ans;
  if (season === "aut") ans = sp.mode === "comp" ? "IND" : young ? "1A" : "+1A";
  else ans = sp.mode === "lim" && sp.spring ? (young ? "2A" : "+2A") : "+1A";
  return { gen, wear: wr, ans };
}
/* Marques pédagogiques : où est la limite, ce qui est juvénile ou neuf */
function hSceneMarks(sp, sc, young) {
  const p = sc.gen._p, out = { mark: [], lim: null, hl: [] };
  if (sp.mode === "wear") { out.mark = [{ id: "P6", t: young ? "frais" : "usé", c: young ? "n" : "" }, { id: "S8", t: young ? "frais" : "usé", c: young ? "n" : "" }]; return out; }
  if (sp.mode !== "lim" || !young || !p) return out;
  const nj = 10 - p.gc;
  if (nj > 0 && nj < 10) { out.lim = ["GC" + nj, "GC" + (nj + 1)]; out.mark.push({ id: "GC" + Math.max(1, nj - 1), t: "juv.", u: 1.16 }, { id: "GC" + Math.min(10, nj + 2), t: "neuves", c: "n", u: 1.16 }); }
  else if (nj === 10) out.mark.push({ id: "GC4", t: "GC juv.", u: 1.16 }, { id: "MC7", t: "MC neuves", c: "n", xy: [352, 37] });
  else out.mark.push({ id: "CP5", t: "CP juv.", xy: [176, 124] }, { id: "GC4", t: "GC neuves", c: "n", u: 1.16 });
  if (p.al && p.al.some(x => !x) && p.al.some(x => x)) out.mark.push({ id: "AL1", t: "alule juv.", xy: [190, 39] });
  return out;
}

/* ---------- Construction des questions ---------- */
const hZoneExpl = g => `<b>${esc(WGROUPS[g].n)}</b>${WGROUPS[g].ab ? ` (${esc(WGROUPS[g].ab)})` : ""} : ${esc(WGROUPS[g].s)}.`;
const hSpAge = () => HSP.filter(s => s.mode === "lim" || s.mode === "wear" || s.mode === "comp");
function hFresh(ses, list, keyf, tag) {
  const seen = new Set(ses.recent.filter(x => typeof x === "string" && x.startsWith(tag)));
  const fresh = list.filter(x => !seen.has(tag + keyf(x)));
  const it = pick(fresh.length ? fresh : list);
  ses.recent.push(tag + keyf(it));
  return it;
}
function hBase(ex, extra) { return { kind: "hand", ex, hintsUsed: 0, hints: [], format: "qcm", ...extra }; }

function hTopoQ(ses) {

  const tail = Math.random() < .2;

function handRecord(q, ok) {
  const H = S.hand || (S.hand = { ex: {}, sp: {} });

  const L = 46, W = 11, f1 = { id: "a", g: "GC", x: 16, y: 6, a: 90, L, w: W, sd: 1 }, f2 = { ...f1, x: 44 };

/* ---------- Petits outils de dessin ---------- */
let ZID = 0;
const ZOL = "#2B2520";
const r1 = x => Math.round(x * 10) / 10;
const zS = (d, f, w = 1.3, x = "") => `<path d="${d}" fill="${f}" stroke="${ZOL}" stroke-width="${r1(w * 10) / 10}" stroke-linejoin="round"${x}/>`;
const zF = (d, f, o) => `<path d="${d}" fill="${f}"${o != null ? ` fill-opacity="${o}"` : ""}/>`;
const zL = (d, c, w, o, x = "") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${r1(w * 10) / 10}" stroke-linecap="round" stroke-linejoin="round"${o != null ? ` stroke-opacity="${o}"` : ""}${x}/>`;
const zE = (cx, cy, rx, ry, f, rot, x = "") => `<ellipse cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${f}"${rot ? ` transform="rotate(${rot} ${r1(cx)} ${r1(cy)})"` : ""}${x}/>`;
const zPts = a => a.map(p => r1(p[0]) + " " + r1(p[1])).join(" L ");
function zShade(h, a) {
  if (!h || h[0] !== "#" || h.length !== 7) return h;
  const n = parseInt(h.slice(1), 16), c = v => Math.max(0, Math.min(255, v + a));
  return "#" + [c(n >> 16), c((n >> 8) & 255), c(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
}

/* ---------- Bec ---------- */
function zBillGeom(s, bx, by, l, d) {
  const T = (x, y) => r1(x) + " " + r1(y);

/* ============================================================

const NET_URL = ""; /* adresse de la base, ex. https://plumage-xxxx-default-rtdb.europe-west1.firebasedatabase.app */

function vwBind(el) {
  const st = $("#vwStage", el);
  let pinch = null, pan = null, lastTap = 0, tapT = 0;
  const pts = () => [...VW.ptr.values()];
  st.addEventListener("pointerdown", e => {
    const V = VW;
    if (!V) return;
    try { st.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
    V.ptr.set(e.pointerId, [e.clientX, e.clientY]);
    if (V.ptr.size === 2) {
      const [a, b] = pts();
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s: V.s, x: V.x, y: V.y };
      pan = null;
    } else if (V.ptr.size === 1) pan = { cx: e.clientX, cy: e.clientY, x: V.x, y: V.y, moved: false };
  });
  st.addEventListener("pointermove", e => {
    const V = VW;
    if (!V || !V.ptr.has(e.pointerId)) return;
    V.ptr.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && V.ptr.size >= 2) {
      const [a, b] = pts(), B = vwBox(), d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const s = clamp(pinch.s * d / pinch.d, 1, 6), k = s / pinch.s;
      V.x = (m[0] - B.cx) - ((pinch.m[0] - B.cx) - pinch.x) * k;
      V.y = (m[1] - B.cy) - ((pinch.m[1] - B.cy) - pinch.y) * k;
      V.s = s;
      vwApply(false);
    } else if (pan) {
      const dx = e.clientX - pan.cx, dy = e.clientY - pan.cy;
      if (Math.abs(dx) + Math.abs(dy) > 8) pan.moved = true;
      if (V.s > 1.02) { V.x = pan.x + dx; V.y = pan.y + dy; vwApply(false); }
      else if (pan.moved) vwDrag(dx, dy);
    }
  });
  const end = e => {
    const V = VW;
    if (!V || !V.ptr.has(e.pointerId)) return;
    V.ptr.delete(e.pointerId);
    if (pinch) {
      if (V.ptr.size < 2) {
        pinch = null;
        if (V.s < 1.08) { V.s = 1; V.x = 0; V.y = 0; }
        vwApply(true);
        if (V.ptr.size === 1) { const [a] = pts(); pan = { cx: a[0], cy: a[1], x: V.x, y: V.y, moved: true }; }
      }
      return;
    }
    if (!pan) return;
    const P = pan, dx = e.clientX - P.cx, dy = e.clientY - P.cy;
    pan = null;
    if (e.type === "pointercancel") { if (V.s <= 1.02) vwDrag(0, 0, true); else vwApply(true); return; }
    if (P.moved) {
      if (V.s > 1.02) { vwApply(true); return; }
      if (dy > 90 && dy > Math.abs(dx)) { closeViewer(); return; }
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && V.items.length > 1) { const d = dx < 0 ? 1 : -1; vwDrag(0, 0, true); vwShow(V.i + d, d); return; }
      vwDrag(0, 0, true);
      return;
    }
    const now = Date.now();
    if (now - lastTap < 320) { clearTimeout(tapT); lastTap = 0; vwZoomAt(e.clientX, e.clientY, V.s > 1.02 ? 1 : 2.6); return; }
    lastTap = now;
    const B = vwBox(), inside = Math.abs(e.clientX - B.cx - V.x) <= B.w * V.s / 2 && Math.abs(e.clientY - B.cy - V.y) <= B.h * V.s / 2;
    if (!inside && V.s <= 1.02) tapT = setTimeout(() => { if (VW === V) closeViewer(); }, 330);
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("wheel", e => { if (!VW) return; e.preventDefault(); vwZoomAt(e.clientX, e.clientY, VW.s * (e.deltaY < 0 ? 1.25 : 0.8)); }, { passive: false });
  el.addEventListener("gesturestart", e => e.preventDefault());
}

/* ---------- Suggestions de saisie ---------- */
let SUGT = 0, SUGQ = "";
function suggItems(q, v) {
  if (q.level === "family") {
    const n = norm(v);
    return [...TAXO.fam.values()].filter(f => norm(f.fr + " " + f.vern + " " + f.sci).split(" ").some(w => w.startsWith(n)) || norm(f.fr).includes(n)).slice(0, 8)
      .map(f => ({ key: "f" + f.id, main: f.fr, sub: f.vern }));
  }
  if (q.level === "order" || q.level === "genus") return [];
  const mode = q.stim === "fr" ? "la" : q.stim === "la" ? "fr" : q.names;
  return lexSearch(v, 8).map(e => ({ key: "s" + e.id, img: e.img, main: mode === "la" ? e.sci : (e.fr || e.sci), sub: mode === "both" && e.fr ? e.sci : "", latin: mode === "la", t: e }));
}
function renderSugg(q, v) {
  const box = $("#sugg");
  if (!box) return;
  const items = v.trim().length < 2 ? [] : suggItems(q, v);
  box.innerHTML = items.map(it => `<button type="button" class="sitem" data-act="sugg" data-k="${it.key}">${it.img ? `<img src="${esc(it.img)}" alt="">` : `<span class="noimg">${ic("tree", "s")}</span>`}<span class="tx">${it.latin ? `<span class="latin" style="font-size:18px">${esc(it.main)}</span>` : `<b>${esc(it.main)}</b>`}${it.sub ? `<small class="latin">${esc(it.sub)}</small>` : ""}</span></button>`).join("");
  return items.length;
}
function suggest(v) {
  const q = SES?.q;
  if (!q || q.done) return;
  SUGQ = v;
  const n = renderSugg(q, v);
  clearTimeout(SUGT);
  if (q.level === "species" && v.trim().length >= 3 && n < 5) {
    SUGT = setTimeout(() => lexRemote(v.trim()).then(() => { if (SUGQ === v && SES?.q === q && !q.done) renderSugg(q, v); }).catch(() => {}), 350);
  }
}

/* ---------- Carte Géo ---------- */
/* Fonds de carte : relief (NASA Blue Marble, montagnes et fonds marins) puis satellite en zoomant,
   satellite, topo, océans (bathymétrie : les îles ressortent), nuit (OSM assombri). Aucun n'exige de clé. */
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const GIBS = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/";
const MAPST = {
  relief: { n: "Relief", lab: true, cap: "NASA Blue Marble · Esri", layers: [
    { u: GIBS + "GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg", max: 8, a: "NASA Blue Marble",
      alt: [GIBS + "/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg", "https://map1.vis.earthdata.nasa.gov/wmts-webmerc/BlueMarble_ShadedRelief_Bathymetry/default//GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpg", ESRI + "World_Physical_Map/MapServer/tile/{z}/{y}/{x}"] },
    { u: ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", min: 9, a: "Esri, Maxar, Earthstar Geographics" }] },
  sat: { n: "Satellite", lab: true, cap: "Esri World Imagery", layers: [{ u: ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", a: "Esri, Maxar, Earthstar Geographics" }] },
  topo: { n: "Topo", light: true, cap: "Esri Topographic", layers: [{ u: ESRI + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}", a: "Esri, HERE, Garmin, USGS, FAO, NPS" }] },
  ocean: { n: "Océans", light: true, cap: "Esri Ocean · GEBCO, NOAA", layers: [{ u: ESRI + "Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}", nat: 13, a: "Esri, GEBCO, NOAA" }, { u: ESRI + "Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}", nat: 13, ov: true, a: "" }] },
  nuit: { n: "Nuit", inv: true, cap: "© OpenStreetMap", layers: [{ u: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", a: "© OpenStreetMap" }] }
};
const MAPLAB = { u: ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", a: "Esri" };
const curStyle = () => MAPST[S.set.mapst] ? S.set.mapst : "relief";
const tileUrl = (u, z, x, y) => u.replace("{z}", z).replace("{x}", x).replace("{y}", y);
const layerAt = (st, z) => st.layers.find(l => !l.ov && (l.min ?? 0) <= z && z <= (l.max ?? 19)) || st.layers[0];
function mapStylesHtml() {
  const cur = curStyle();
  return `<div class="mst">${Object.entries(MAPST).map(([k, st]) => `<button class="${k === cur ? "on" : ""}" data-act="mapset" data-s="${k}" aria-label="Fond ${esc(st.n)}"><span class="th${st.inv ? " inv" : ""}" style="background-image:url('${esc(tileUrl(layerAt(st, 2).u, 2, 2, 1))}')"></span><small>${esc(st.n)}</small></button>`).join("")}</div>`;
}
const mapTog = (k, icn, label) => `<button class="chip${S.set[k] ? " on" : ""}" data-act="toggle" data-k="${k}" role="switch" aria-checked="${S.set[k] ? "true" : "false"}">${ic(icn)}${label}</button>`;
const mapMenuHtml = () => `${mapStylesHtml()}<div class="mtg">${mapTog("mapLab", "type", "Noms")}${mapTog("mapIsl", "isle", "Îles")}</div>`;
function tileL(sp, extra, onDead) {
  const alts = (sp.alt || []).slice();
  const o = { attribution: sp.a || "", minZoom: sp.min ?? 0, maxZoom: sp.max ?? 19, ...extra };
  if (sp.max != null) o.maxNativeZoom = sp.max;
  if (sp.nat) o.maxNativeZoom = sp.nat;
  const l = L.tileLayer(sp.u, o);
  let ok = 0, bad = 0;
  l.on("tileload", () => { ok++; });
  l.on("tileerror", () => {
    if (ok || ++bad < 4) return;
    bad = 0;
    if (alts.length) l.setUrl(alts.shift());
    else if (onDead) { const f = onDead; onDead = null; f(); }
  });
  return l;
}
function setMapStyle(map, id) {
  const st = MAPST[id] || MAPST.relief;
  (map._plum || []).forEach(l => map.removeLayer(l));
  map._plum = [];
  const dead = () => {
    if (map !== GMAP || id === "nuit") return;
    toast(`Fond « ${st.n} » indisponible pour l'instant : fond Nuit à la place.`);
    setMapStyle(map, "nuit");
  };
  st.layers.forEach((sp, i) => {
    if (sp.ov && !S.set.mapLab) return;
    const l = tileL(sp, { className: st.inv ? "tl-inv" : "", pane: sp.ov ? "labels" : "tilePane" }, i === 0 ? dead : null);
    l.addTo(map);
    map._plum.push(l);
  });
  if (st.lab && S.set.mapLab) { const l = tileL(MAPLAB, { pane: "labels" }); l.addTo(map); map._plum.push(l); }
  map._plumSt = id;
  map.getContainer().classList.toggle("light", !!st.light);
  islStyle(map);
}
/* Îles : un anneau tant que l'île est trop petite pour être vue ; le toucher pose le pin dessus */
function addIslands(map) {
  const rd = L.canvas({ padding: .3, tolerance: 9 });
  map._isl = ISLANDS.map(isl => {
    const m = L.circleMarker([isl[1], isl[2]], { renderer: rd, radius: 6, weight: 1.4, opacity: .9, fillOpacity: .14, bubblingMouseEvents: false });
    m.isl = isl;
    m.bindTooltip(isl[0], { permanent: true, direction: "right", offset: [7, 0], className: "isl-lbl", opacity: 1 });
    m.on("click", () => { const q = SES?.q; if (q && q.kind === "geo" && !q.done) placePin(q, m.getLatLng(), isl[0]); });
    return m;
  });
  map.on("zoomend", () => islUpdate(map));
  islStyle(map);
  islUpdate(map);
}
function islStyle(map) {
  const c = (MAPST[map._plumSt] || {}).light ? "#05627F" : "#8AF4FF";
  (map._isl || []).forEach(m => m.setStyle({ color: c, fillColor: c }));
}
function islUpdate(map) {
  if (!map._isl) return;
  const z = map.getZoom(), on = S.set.mapIsl && !map._revealed, rings = [], labs = [];
  const r = z < 1.5 ? 3.5 : z < 3 ? 5 : 6.5, gap = z < 3 ? 13 : 16;
  map.getContainer().classList.toggle("zlo", z < 3.5);
  map._isl.forEach(m => {
    const [name, la, ln, d] = m.isl;
    let vis = on && z <= 10 && d / (156.543 * Math.cos(la * Math.PI / 180) / 2 ** z) < 12, lab = false;
    if (vis) {
      const p = map.project([la, ln], z);
      vis = !rings.some(s => Math.abs(s.x - p.x) < gap && Math.abs(s.y - p.y) < gap);
      if (vis) {
        const w = 8 + name.length * 6.4, box = [p.x + 5, p.y - 8, p.x + 5 + w, p.y + 8];
        lab = z >= 3.5 && !labs.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]) && !rings.some(s => s.x > box[0] - 4 && s.x < box[2] && Math.abs(s.y - p.y) < 10);
        rings.push(p);
        if (lab) labs.push(box);
      }
    }
    if (vis) { m.setRadius(r); if (!map.hasLayer(m)) m.addTo(map); }
    else if (map.hasLayer(m)) map.removeLayer(m);
    const te = m.getTooltip()?.getElement();
    if (te) te.classList.toggle("hid", !lab);
  });
}
function mapExtras() {
  if (!GMAP) return;
  setMapStyle(GMAP, GMAP._plumSt || curStyle());
  islUpdate(GMAP);
}
function placePin(q, ll, name) {
  if (!GMAP || q.done) return;
  q.guess = [ll.lat, ((ll.lng + 540) % 360) - 180];
  q.guessName = name || "";
  if (q.guessM) q.guessM.setLatLng(ll);
  else q.guessM = L.circleMarker(ll, { pane: "markerPane", radius: 9, color: "#fff", weight: 3, fillColor: "#FF8B3D", fillOpacity: 1, interactive: false }).addTo(GMAP);
  const b = $("#gok");
  if (b) { b.disabled = false; b.innerHTML = ic("check") + `<span>Valider${name ? " · " + esc(name) : ""}</span>`; }
}
function setMapFull(on) {
  const w = $("#gwrap");
  if (!w) { document.body.classList.remove("gfull"); return; }
  on = on ?? !w.classList.contains("full");
  w.classList.toggle("full", on);
  document.body.classList.toggle("gfull", on);
  const b = w.querySelector("[data-act=mapfull]");
  if (b) { b.innerHTML = ic(on ? "shrink" : "expand"); b.setAttribute("aria-label", on ? "Réduire la carte" : "Agrandir la carte"); }
  if (GMAP) {
    const m = GMAP, fill = () => { m.invalidateSize(); const zf = Math.floor(Math.log2(m.getSize().y / 256) * 2) / 2; if (on && m.getZoom() < zf) m.setZoom(zf); };
    requestAnimationFrame(() => m.invalidateSize());
    setTimeout(() => { if (GMAP === m) fill(); }, 280);
  }
}
let GMAP = null;
function mountGeoMap(q) {
  const el = $("#gmap");
  document.body.classList.remove("gfull");
  if (!el || !window.L) return;
  if (GMAP) { try { GMAP.remove(); } catch (e) { /* rien */ } }
  const z0 = clamp(Math.floor(Math.log2(Math.max(256, el.clientWidth) / 256) * 2) / 2, .5, 3);
  const map = GMAP = L.map(el, { worldCopyJump: true, zoomControl: false, attributionControl: true, minZoom: .5, maxZoom: 14, zoomSnap: .5 }).setView([22, 8], z0);
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  const lp = map.createPane("labels");
  lp.style.zIndex = 350;
  lp.style.pointerEvents = "none";
  setMapStyle(map, curStyle());
  addIslands(map);
  q.guessM = null;
  map.on("click", e => placePin(q, e.latlng));
  setTimeout(() => map.invalidateSize(), 50);
}
function geoValidate() {
  const q = SES?.q;
  if (!q || q.done || !q.guess) return;
  const km = haversine(q.guess, [q.lat, q.lng]), tier = geoTier(km);
  setMapFull(false);
  const mm = $("#mmenu");
  if (mm) mm.hidden = true;
  $$(".gstrip").forEach(g => g.classList.add("reveal"));
  $(".view.quiz")?.classList.add("georeveal");
  if (GMAP) {
    GMAP.invalidateSize();
    GMAP._revealed = true;
    islUpdate(GMAP);
    const t = [q.lat, q.lng];
    L.circleMarker(t, { radius: 10, color: "#fff", weight: 3, fillColor: "#1FD1F2", fillOpacity: 1 }).addTo(GMAP);
    L.circle(t, { radius: 10000, color: "#1FD1F2", weight: 1, fillOpacity: .12 }).addTo(GMAP);
    L.polyline([q.guess, t], { color: "#FFCB5C", weight: 2, dashArray: "6 6" }).addTo(GMAP);
    GMAP.fitBounds(L.latLngBounds([q.guess, t]).pad(.35), { maxZoom: 8 });
  }
  $("#gok")?.remove();
  settle({ ok: km <= 1500, geoKm: km, geoPts: tier[1] });
  window.scrollTo(0, 0);
}

function tripObs(id) {
  const z = tripZone(), place = zoneLabel(z), d = dayKey();
  let t = (TRIP.list || []).find(x => x.id === id);
  if (!t) {
    const e = LEX.get(id);
    if (!e) return;
    t = { id: e.id, sci: e.sci, fr: e.fr, img: e.img ? { sq: e.img, md: sizeUrl(e.img, "medium"), attr: "", lic: "" } : null, a: [], f: e.f || 0, c: 0 };
    (TRIP.list || (TRIP.list = [])).unshift(t);
  }
  const obs = S.obs || (S.obs = []), i = obs.findIndex(o => o.id === id && o.d === d && o.p === place), r = rec(t);
  if (i >= 0) {
    obs.splice(i, 1);
    r.nobs = Math.max(0, (r.nobs || 1) - 1);
    const prev = obs.filter(o => o.id === id).pop();
    r.seen = prev ? [prev.d, prev.p] : null;
  } else {
    obs.push({ id, d, p: place, la: z?.lat ?? null, ln: z?.lng ?? null });
    if (obs.length > 3000) obs.splice(0, obs.length - 3000);
    r.nobs = (r.nobs || 0) + 1; r.seen = [d, place];
    buzz(12);
  }
  save();
  const b = $("#tchk"); if (b) b.innerHTML = tripChkHtml();
  const n = tripSeen().size, c = $("#tcount"), dn = $("#tdone");
  if (c) c.textContent = n;

const CARNET = { q: "", f: "all" };
function carnetList() {
  const tday = todayNum(), q = norm(CARNET.q);
  let all = Object.entries(S.sp).filter(([, r]) => r.n > 0 || r.nobs > 0).map(([id, r]) => ({ id: +id, r }));
  if (CARNET.f === "due") all = all.filter(x => Object.values(x.r.due || {}).some(d => d <= tday));
  if (CARNET.f === "master") all = all.filter(x => stars(x.r) === 3);
  if (CARNET.f === "weak") all = all.filter(x => x.r.n >= 2 && x.r.ok / x.r.n < .6);
  if (CARNET.f === "field") all = all.filter(x => FIELD.ids.has(x.id) || x.r.nobs > 0);

}

function heatHtml() {
  const tn = todayNum(), start = tn - 83 - ((new Date().getDay() + 6) % 7);
  const cells = [];
  for (let n = start; n <= tn; n++) {
    const d = S.days[keyOfNum(n)], xp = d?.xp || 0;
    const l = !xp ? "" : xp < 40 ? "l1" : xp < 100 ? "l2" : xp < 200 ? "l3" : "l4";
    cells.push(`<i class="${l} ${n === tn ? "today" : ""}" title="${keyOfNum(n)} : ${xp} XP"></i>`);
  }
  return `<div class="heat">${cells.join("")}</div>`;
}
function chartHtml() {
  const tn = todayNum(), days = Array.from({ length: 14 }, (_, i) => { const k = keyOfNum(tn - 13 + i); return { k, d: S.days[k] }; });
  const max = Math.max(60, ...days.map(x => x.d?.xp || 0));
  const W = 340, H = 150, bw = 16, gap = (W - 20 - bw * 14) / 13;
  const bars = days.map((x, i) => {
    const xp = x.d?.xp || 0, h = Math.max(2, (xp / max) * (H - 40)), X = 10 + i * (bw + gap), Y = H - 22 - h;
    const wd = "LMMJVSD"[(new Date(x.k + "T12:00:00").getDay() + 6) % 7];
    return `<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" style="fill:${xp ? "var(--gold)" : "rgba(255,255,255,.08)"}"><title>${x.k} : ${xp} XP</title></rect><text x="${(X + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${wd}</text>`;
  }).join("");
  const pts = days.map((x, i) => x.d?.q ? [10 + i * (bw + gap) + bw / 2, 8 + (1 - x.d.ok / x.d.q) * (H - 40)] : null);
  const line = pts.filter(Boolean).map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
  const dots = pts.filter(Boolean).map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" style="fill:var(--cyan);stroke:var(--card);stroke-width:2"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="XP et réussite sur 14 jours">${bars}${line ? `<polyline points="${line}" style="fill:none;stroke:var(--cyan);stroke-width:2;stroke-linejoin:round;opacity:.9"/>` : ""}${dots}</svg>
  <div style="display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold);margin-right:6px"></i>XP du jour</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cyan);margin-right:6px"></i>Taux de réussite</span></div>`;
}

function onClick(e) {
  const mm = $("#mmenu");
  if (mm && !mm.hidden && !e.target.closest("#mmenu,[data-act=mapmenu]")) mm.hidden = true;
  const el = e.target.closest("[data-act]");
  if (el) {
    if (el.disabled) return;
    const f = ACT[el.dataset.act];
    if (f) { e.preventDefault(); f(el, e); }
    return;
  }
  if (e.target.id === "layer") closeLayer();
}
function onKey(e) {
  if (VW) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const d = e.key === "ArrowRight" ? 1 : -1; vwShow(VW.i + d, d); }
    return;
  }
  const tg = e.target;
  if (tg && tg.matches && tg.matches("input, textarea")) { if (e.key === "Escape") tg.blur(); return; }
  if (e.key === "Escape") { if (!$("#layer").hidden) closeLayer(); return; }
  if (VIEW === "live" && LIVE.st === "q" && /^[1-6]$/.test(e.key)) { $$("#lans [data-act=lpick]")[+e.key - 1]?.click(); return; }
  if (VIEW !== "quiz" || !$("#layer").hidden) return;
  const fbOpen = $("#fb");
  const hq = SES?.q;
  if (hq && hq.kind === "hand" && !fbOpen && hq.format === "score" && /^[0-5]$/.test(e.key)) { $(`#answers [data-act=pick][data-k="${e.key}"]`)?.click(); return; }
  if (hq && hq.kind === "hand" && !fbOpen && hq.format === "tap" && e.key === "Enter") { e.preventDefault(); handValidate(); return; }
  if (/^[1-6]$/.test(e.key) && !fbOpen) { const btns = $$("#answers [data-act=pick]"); btns[+e.key - 1]?.click(); }
  else if ((e.key === "Enter" || e.key === " ") && fbOpen) { e.preventDefault(); nextQuestion(); }
  else if (e.key.toLowerCase() === "h" && !fbOpen) $("[data-act=hint]")?.click();
  else if (e.key.toLowerCase() === "r") { unlockAudio(); sndPlay(); }
}
function onSubmit(e) {
  if (e.target.id === "ljoin") { e.preventDefault(); $("#lcode")?.blur(); liveJoin($("#lcode")?.value || ""); return; }
  if (e.target.id === "typer") {
    e.preventDefault();
    const q = SES?.q;
    if (!q || q.done) return;
    const v = $("#ans").value;
    if (!v.trim()) return;
    $("#ans").blur();
    const r = checkTyped(v, q);
    /* Nom d'une autre espèce : on montre ce qui les sépare, comme pour un QCM */
    if (!r.ok && q.level === "species") { const m = lexExact(v); if (m && m.id !== q.t.id) r.chosen = { t: m }; }
    settle({ ...r, typed: v });
  }
}
